[project]
name = "wayaz-backend"
version = "0.1.0"
description = "Headless Django e-commerce backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "django-cors-headers>=4.5,<4.6",
    "pymysql>=1.1.0",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "djangorestframework-simplejwt>=5.3.0",
    "whitenoise>=6.12.0",
    "gunicorn>=23.0.0",
    "drf-spectacular>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "B006",   # mutable-argument-default (DRF/Django idioms)
    "E501",   # line length is enforced by ruff format (long data strings stay)
    "SIM105", # contextlib.suppress is not clearer than try/except pass
]

[tool.ruff.lint.per-file-ignores]
"*/management/commands/*.py" = ["B008"] # command kwargs in defaults
"manage.py" = ["E402"]
