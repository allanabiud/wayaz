services:
  db:
    image: mariadb:11.4
    container_name: wayaz_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wayaz
      MARIADB_USER: wayaz
      MARIADB_PASSWORD: wayaz_secret
      MARIADB_ROOT_PASSWORD: wayaz_root_secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dbdata:
